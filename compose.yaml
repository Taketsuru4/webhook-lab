services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webhook_lab
      POSTGRES_PASSWORD: webhook_lab_local
      POSTGRES_DB: webhook_lab
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webhook_lab -d webhook_lab']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
